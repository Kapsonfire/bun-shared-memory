name: Stress defrag race

# Temporary: hunts an intermittent failure of the concurrent defragmentation
# test that only shows on GitHub runners. Runs only for this branch.
on:
  push:
    branches: [fix/defrag-race]

permissions:
  contents: read

jobs:
  stress:
    name: ${{ matrix.mode }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mode: [single, suite]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Loop until the test fails
        run: |
          nproc
          for i in $(seq 1 ${{ matrix.mode == 'single' && 60 || 12 }}); do
            if [ "${{ matrix.mode }}" = single ]; then
              cmd="bun test --coverage test/concurrent-defrag.test.ts"
            else
              cmd="bun test --coverage"
            fi
            if ! out=$($cmd 2>&1); then
              echo "::error::failed on iteration $i"
              echo "$out" | grep -v '^(pass)' | tail -120
              exit 1
            fi
            echo "iteration $i ok"
          done
