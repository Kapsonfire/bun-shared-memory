sonar.projectKey=bun-shared-memory
sonar.organization=kapsonfire-de
sonar.sourceEncoding=UTF-8
# The scanner analyzes the whole repository (sonar.sources/sonar.tests have
# no effect any more), so everything but the library (src/) and the CI
# workflow (.github/) is excluded here.
sonar.exclusions=build.ts,index.ts,examples/**,bench/**,benchlogs/**,test/**,coverage/**
# Written by `bun run test:coverage` (CI analysis must run it before the scanner).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
