# MySQL + Redis services for the real-world benchmark.
#
# Start them with:
#   docker compose -f bench/real-world/docker-compose.yml up -d
#
# This file exposes both services over TCP only, which works everywhere
# (including Docker Desktop on macOS/Windows). To additionally benchmark Unix
# sockets, which only work with a native Docker on Linux, add the override:
#   docker compose -f bench/real-world/docker-compose.yml \
#                  -f bench/real-world/docker-compose.sockets.yml up -d
# The benchmark connects with the credentials below (see run.ts / api.ts).
services:
  mysql:
    image: mysql:8.4
    container_name: bun-shared-memory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
    # MySQL 8.4 disables mysql_native_password by default, but Bun's native SQL
    # client cannot use the default caching_sha2_password over an insecure
    # connection. Enable the plugin and give the bench user that auth method
    # (see mysql-init.sql, run once when the container is first created).
    command: ["--mysql-native-password=ON"]
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/01-native-password.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: bun-shared-memory-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
