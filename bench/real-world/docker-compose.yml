# MySQL service for the real-world benchmark.
#
# Start it with:
#   docker compose -f bench/real-world/docker-compose.yml up -d
#
# The benchmark connects with the credentials below (see run.ts / api.ts).
services:
  mysql:
    image: mysql:8.4
    container_name: bun-shared-memory-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: bench
      MYSQL_USER: bench
      MYSQL_PASSWORD: bench
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 2s
      timeout: 2s
      retries: 30
